<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --primary-grad: linear-gradient(135deg, #4f46e5 0%, #06b6d4 100%);
      --danger-grad: linear-gradient(135deg, #ef4444 0%, #f87171 100%);
      --bg: #f3f4f6;
      --card-bg: #ffffff;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-hover: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
    
    body { 
      width: 380px; 
      background-color: var(--bg); 
      color: var(--text-main);
    }

    /* HEADER */
    .header {
      background: var(--primary-grad);
      padding: 24px 20px;
      color: white;
      text-align: center;
      border-radius: 0 0 20px 20px;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
    }
    .header h1 { font-size: 18px; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 4px; }
    .badge { 
      background: rgba(255,255,255,0.2); 
      padding: 4px 10px; 
      border-radius: 20px; 
      font-size: 10px; 
      font-weight: 600; 
      backdrop-filter: blur(4px);
    }

    .container { padding: 0 20px 20px; }

    /* CARDS */
    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255,255,255,0.5);
    }

    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      font-weight: 700;
      margin-bottom: 12px;
      display: block;
    }

    /* INPUTS GRID */
    .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    
    .input-group label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text-muted);
    }
    
    input {
      width: 100%;
      padding: 10px 12px;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
      transition: all 0.2s;
      background: #f9fafb;
    }
    input:focus { 
      outline: none; 
      border-color: #4f46e5; 
      background: #fff;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }

    /* STATS GRID */
    .stats-panel { display: none; animation: slideDown 0.3s ease; }
    @keyframes slideDown { from {opacity:0; transform:translateY(-10px);} to {opacity:1; transform:translateY(0);} }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 15px;
    }
    .stat-box {
      background: #f3f4f6;
      padding: 12px;
      border-radius: 12px;
      text-align: center;
    }
    .stat-value { font-size: 20px; font-weight: 800; display: block; }
    .stat-label { font-size: 10px; color: var(--text-muted); font-weight: 600; }
    .text-danger { color: #ef4444; }
    .text-success { color: #10b981; }

    /* ACTION INFO */
    .action-info {
      font-size: 12px;
      text-align: center;
      color: var(--text-muted);
      margin-top: 10px;
      background: #eef2ff;
      padding: 8px;
      border-radius: 8px;
      color: #4f46e5;
      font-weight: 600;
      white-space: nowrap; 
      overflow: hidden; 
      text-overflow: ellipsis;
    }

    /* PROGRESS BAR */
    .progress-container {
      height: 8px;
      background: #e5e7eb;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 12px;
    }
    .progress-bar {
      height: 100%;
      background: var(--primary-grad);
      width: 0%;
      transition: width 0.3s ease;
      background-size: 20px 20px;
      background-image: linear-gradient(45deg,rgba(255,255,255,.15) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.15) 50%,rgba(255,255,255,.15) 75%,transparent 75%,transparent);
      animation: progress-stripes 1s linear infinite;
    }
    @keyframes progress-stripes { from {background-position: 20px 0} to {background-position: 0 0} }

    /* BUTTONS */
    .btn-group { display: flex; flex-direction: column; gap: 10px; }
    
    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }
    
    button:active { transform: scale(0.98); }

    .btn-action {
      background: white;
      color: var(--text-main);
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      border: 1px solid #e5e7eb;
    }
    .btn-action:hover:not(:disabled) {
      border-color: #4f46e5;
      background: #f9fafb;
      color: #4f46e5;
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }
    .btn-action .icon { font-size: 16px; width: 20px; text-align: center; }

    .btn-primary {
      background: var(--primary-grad);
      color: white;
      justify-content: center;
      box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.3);
    }
    .btn-primary:hover:not(:disabled) {
      box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.4);
      transform: translateY(-2px);
    }

    .btn-stop {
      background: var(--danger-grad);
      color: white;
      justify-content: center;
      display: none;
      box-shadow: 0 4px 6px -1px rgba(239, 68, 68, 0.3);
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0% {box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4);} 70% {box-shadow: 0 0 0 10px rgba(239, 68, 68, 0);} 100% {box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);} }

    button:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }

    /* STATUS TOAST */
    .status-msg {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      font-size: 12px;
      text-align: center;
      font-weight: 600;
      display: none;
      animation: slideUp 0.3s ease;
    }
    @keyframes slideUp { from {opacity:0; transform:translateY(10px);} to {opacity:1; transform:translateY(0);} }
    
    .status-msg.active { display: block; }
    .status-msg.info { background: #e0e7ff; color: #4338ca; }
    .status-msg.success { background: #d1fae5; color: #065f46; }
    .status-msg.error { background: #fee2e2; color: #991b1b; }

  </style>
</head>
<body>

  <div class="header">
    <h1>👥 Friend Cleaner</h1>
    <span class="badge">PRO VERSION (UNLOCKED)</span>
  </div>

  <div class="container">
    
    <div class="card" id="settingsCard">
      <span class="section-title">Configuration</span>
      <div class="settings-grid">
        <div class="input-group">
          <label>Limite (0 = tout)</label>
          <input type="number" id="maxFriends" placeholder="ex: 50" min="0">
        </div>
        <div class="input-group">
          <label>Délai (secondes)</label>
          <input type="number" id="delay" value="1" min="0.5" step="0.5">
        </div>
      </div>
    </div>

    <div class="card stats-panel" id="statsCard">
      <span class="section-title" style="margin-bottom:15px; display:flex; justify-content:space-between; align-items:center;">
        Progression en cours
        <span style="font-size:18px;" class="icon">⚡</span>
      </span>
      
      <div class="stats-grid">
        <div class="stat-box">
          <span class="stat-value text-danger" id="countRemoved">0</span>
          <span class="stat-label">Supprimés</span>
        </div>
        <div class="stat-box">
          <span class="stat-value text-muted" id="countSkipped">0</span>
          <span class="stat-label">Ignorés</span>
        </div>
      </div>

      <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      
      <div class="action-info" id="currentAction">
        Initialisation...
      </div>
    </div>

    <div class="btn-group">
      <button class="btn-action" id="btnArabic">
        <span class="icon">📝</span> 
        <span>Supprimer Noms Arabes</span>
      </button>
      
      <button class="btn-action" id="btnNonArabic">
        <span class="icon">🔤</span> 
        <span>Supprimer Noms Non-Arabes</span>
      </button>
      
      <button class="btn-action" id="btnNoMutual">
        <span class="icon">🚫</span> 
        <span>Sans amis communs</span>
      </button>
      
      <button class="btn-primary" id="btnAll">
        <span class="icon">🗑️</span> 
        <span>TOUT SUPPRIMER (FULL)</span>
      </button>
      
      <button class="btn-stop" id="btnStop">
        ⏹️ ARRÊT D'URGENCE
      </button>
    </div>

    <div id="statusBox" class="status-msg"></div>

  </div>
  <script src="popup.js"></script>
</body>
</html>
